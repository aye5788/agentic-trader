# ============================================================================
# STRATEGY MANDATE  —  the single source of truth for WHAT the system does.
#
# Loaded by the Research Store (the [risk] table = its validation gates) and by
# the slow/fast loops (universe, signal, regime). Human-editable; change the
# strategy HERE, not in code. See docs/DESIGN.md → "Strategy foundation" /
# "Trade management & risk rules" / "Regime gate".
# ============================================================================

[meta]
name       = "dual-momentum-v1"
horizon    = "swing"              # multi-day to a few weeks
edge       = "momentum"           # hybrid dual momentum (relative rank + absolute trend)
instrument = "equities"          # equities ONLY — options are OFF (no options risk)
account    = "robinhood-agentic" # execution: RH Agentic account ONLY
# Full prose spec written for the deployed agent: docs/STRATEGY.md

# --- Risk gates: enforced by the Research Store on every write_product() -----
# (These ARE research_store.validate.DEFAULT_MANDATE, externalized.)
[risk]
max_weight_per_name = 0.10        # IBD "full position" = 10% of the sleeve
max_total_weight    = 1.0         # fully-invested ceiling (sum of weights)
min_reward_risk     = 2.0         # require >= 2:1 reward:risk geometry
max_holdings        = 14          # concentration guard = book_hold(10) + sleeve_hold(4)

# --- Trade management (IBD-SwingTrader-derived), applied per thesis ----------
[trade_management]
stop_style    = "volatility_adjusted"  # stop = stop_atr_mult * daily-sigma below entry
stop_atr_mult = 2.5                     # ATR/sigma multiple for the stop distance
target_r_mults = [2.2, 4.0]             # targets as multiples of risk (R): tier1 >= 2
                                        #   keeps reward:risk >= 2:1 BY CONSTRUCTION, and
                                        #   scales both stop & targets to each name's vol
                                        #   (a fixed +5% target is unreachable at 2:1 for a
                                        #   5%/day mover — it would reject the whole book).
ma_exit_days  = 21                      # exit if close < 21-day MA, even pre-target
no_chase      = true                    # only enter within the thesis entry_zone
chase_tol_sigma = 0.5                   # how far ABOVE entry_zone[1] still counts as
                                        #   "not chasing", in daily sigmas. Asymmetric:
                                        #   a price BELOW the zone is a better fill and
                                        #   is never blocked. Vol-scaled because the zone
                                        #   is a flat +/-0.5% band. 0.5s blocks ~8% of
                                        #   entries (2y/168 names); it would have blocked
                                        #   LITE (-18.1%) and KEEL (-14.1%) on 2026-07-23.
                                        #   Raise to loosen, 0 = only the raw zone.

# --- The momentum signal (see docs/STRATEGY.md §3 for exact math) ------------
# Deterministic. Run as CODE, do not eyeball. Same signal on both engines.
[signal]
lookback_days     = 252     # 12-month formation window
skip_recent_days  = 0       # 12-0: INCLUDE the most recent month (no skip)
trend_ma_days     = 200     # trend view = close / SMA(200) - 1
# Relative rank = equal-weight rank-average of [ risk-adjusted return (R/sigma),
#   trend (close/SMA200 - 1) ]. NO tunable weights — do not add any.
rank_method       = "rank_average"
absolute_gate     = "return_positive"   # eligible only if 12mo total return > 0

# --- Residual (idiosyncratic) momentum tilt — sector variant, adopted 2026-07-24 -----
# Blends residual momentum into the BOOK rank: rank a name on its OWN strength after
# stripping out how much it just rode its sector's wave. This is a structural signal
# CHOICE (distinct from the rank_average internals above, which stay untuned).
# Backtest (survivorship-free PIT pool, 2021-2026): 0.75-sector beat the plain signal
# on all three lenses — CAGR 25.9 vs 21.6, Sharpe 1.03 vs 0.90, MaxDD -29.2 vs -31.2.
# Now forward-proving on live fills. REVERT = set residual_tilt = 0.0 (one line, instant).
residual_tilt     = 0.75         # 0.0 = off (plain momentum); 0.75 = adopted blend
residual_factors  = "sector"     # "sector" (11 SPDR ETFs) | "market" (SPY) | "none"

# --- Portfolio construction (see docs/STRATEGY.md §4) -----------------------
[portfolio]
book_weight   = 0.70    # single-name book share of capital
sleeve_weight = 0.30    # ETF sleeve share of capital
book_hold     = 10      # names held in the book
book_band     = 15      # banded exit: keep a held name until it drops below rank 15
sleeve_hold   = 4       # ETFs held in the sleeve
rebalance     = "weekly"  # full re-rank + rotate weekly; risk exits run nightly

# --- Tradeable universe -----------------------------------------------------
# MOMENTUM edge: a FIXED, curated single-name universe that the cross-sectional
# ranker scores nightly (not the old PEAD earnings_dynamic mode). Membership is
# reconciled human-seed (54 conviction names) + liquidity fill by dollar volume.
# Full list + provenance: config/universe.csv (as_of 2026-07-08).
[universe]
mode      = "fixed_list"
source    = "config/universe.csv"   # 150 US single names; `flag` col marks
                                    #   adr/micro/spec/fresh-ipo model-caveats
size      = 150
# ETFs are NOT mixed into this single-name rank (a broad basket never
# out-momentums an individual winner -> dead slot). They run as their own
# parallel rotation sleeve, below.

# --- ETF rotation sleeve ----------------------------------------------------
# A SECOND, self-contained dual-momentum engine (the classic footprint): rank
# the sleeve by the same hybrid logic, hold the top few that also pass absolute
# trend. Defensive assets (bonds/gold) sit INSIDE the rank -> in risk-off they
# win the ranking and become the destination automatically (built-in off-switch;
# no separate cash-vs-bond rule). Members + roles: config/etf_universe.csv.
[etf_sleeve]
enabled  = true
source   = "config/etf_universe.csv"
members  = 18            # 11 SPDR sectors + 2 broad (SPY,IWM) + 2 intl (EFA,EEM)
                         #   + 3 asset/defensive (GLD,TLT,AGG)
hold_top = 4             # concurrent ETF holdings (tune with the single-name book)
# NOTE: capital split between this sleeve and the single-name book is a separate
# open axis (portfolio construction) — not set here yet.

# --- Regime floor (mechanical ON switch; agent overlay deferred to v2) -------
[regime]
index          = "$SPX"
trend_ma_days  = 50      # no NEW entries unless index > its 50-day MA
vix_ceiling    = 28.0    # no NEW entries if VIX above this
agent_overlay  = false   # v1 = deterministic-only; qualitative veto in v2

# --- Intraday exit monitor — the always-on stop-loss / take-profit watcher ----
# Part 1 (scripts/market_monitor.py) polls moomoo quotes during market hours and
# fires the executor (prompts/exit.md) on a breach. Enforces the per-name stops
# the daily loops only STORE. See docs/DESIGN.md → "Intraday exit monitor".
[monitor]
poll_secs      = 15       # seconds between quote polls (whole book = 1 moomoo call)
enable_stops   = true     # sell a full position when price <= its stored stop
enable_targets = true     # scale out at the take-profit tiers (t1 half, t2 rest)
                          #   NOTE: take-profits cap momentum winners — set false
                          #   to "let winners run" and rely on rank rotation instead.
cooldown_days  = 5        # a stopped-out name is excluded from the book this long
                          #   (stop vs. momentum-rank rebuy-churn guard)
executor_timeout_secs = 300  # wall clock for the headless exit executor. The SELL is
                          #   step 4 of 8 and the tail is bookkeeping, so a kill after
                          #   the sell is survivable (run_executor reads the result
                          #   FILE, not the exit code, and exit.md writes it after each
                          #   placement). Was 180; the 2026-08-06 WDC stop used all of
                          #   it on post-sale reconciliation.
refire_retry_secs = 120   # if an exit sell FAILS, back off this long before retrying
                          #   (a failing breach re-spawns the Claude executor + re-
                          #   alerts; without backoff it storms every 15s poll)
refire_escalate_n = 3     # after this many consecutive failed exits, send ONE loud
                          #   "manual intervention — position unprotected" phone push
feed_fail_alert = 4       # consecutive quote-poll failures (~1 min @15s) before ONE
                          #   "feed down — stops unwatched" phone push. Each failing
                          #   tick rebuilds the moomoo client, so transients self-heal
                          #   long before this (guards the 2026-07-22 stale-token hang).
feed_fail_exit  = 12      # consecutive failures (~3 min) → monitor exits nonzero so
                          #   systemd (Restart=always) restarts it with a clean client.
feed_alert_cooldown_mins = 30  # min gap between feed-down pushes; a genuine multi-day
                          #   outage becomes a periodic reminder, not a per-tick storm.
alert_only     = false    # true = detect+journal breaches but place NO sells
                          #   (also forced alert-only whenever live_approved=false)

# --- Post-take-profit re-entry review (the agent overlay's one live surface) --
# Without this, a target hit is blindly rebought next morning (fixed slot
# weights + no cooldown). With it, the rebuy goes to JUDGMENT: the fast-loop
# agent may re-enter full, re-enter half, or skip — veto/downsize ONLY, never
# more than the mechanical plan wanted (docs/DESIGN.md: agent overlay = OFF
# switch). One rule stays pure code: the knife guard below.
[reentry]
enabled         = true    # false = revert to blind mechanical rebuy
knife_guard_pct = 0.04    # HARD block, no discretion: no rebuy if price fell
                          #   more than this below the take-profit exit fill
review_days     = 5       # judgment window; after this the name rebuys normally
allow_half      = true    # the downsize option in the agent's menu

# --- Governance guardrails (Layer 5) — the last gate before any live order ---
# The [risk] mandate validates the research PRODUCT on write; these validate
# EXECUTION at trade time. Enforced by src/governance.py in the fast loop.
[governance]
# TWO SWITCHES (2026-08-09). Stops here are SOFTWARE-ONLY — the monitor process
# IS the stop — so a gate that blocks sells does not pause risk, it removes an
# open position's only protection. Hence the split:
#   HALT         the machine places NO order, buy or sell. It keeps WATCHING and
#                phones you on every breach; you place the exit by hand.
#   HALT_ENTRIES no new buys. Stop/target exits stay fully armed. Use this one
#                when the market scares you; use HALT when the CODE scares you.
kill_switch_file  = "research_store/HALT"          # touch to stop, rm to resume
halt_entries_file = "research_store/HALT_ENTRIES"  # touch to stop BUYING only
max_drawdown     = 0.25                    # halt new buys if account down >25% from its tracked peak
                                           #   (blocks entries only — never an exit)
max_order_pct    = 0.15                    # reject any single order > 15% of account value
require_whitelist = true                   # only ever trade names in config/universe.csv + etf_universe.csv

# --- How much proof before / during live trading ----------------------------
[proof]
mode          = "backtest_first"  # validate the signal vs history before the $20
entry_cadence = "nightly"          # v1: no same-day catalyst reaction
live_approved  = false            # MASTER SWITCH: fast loop may PLACE orders only when true.
                                  # Ships SAFE. Arm a box via git-ignored
                                  # config/strategy.local.toml:  [proof] live_approved = true

# --- Intraday risk-management overlay (docs/superpowers/specs/2026-07-14-*) ---
# Two scheduled agentic reviews tend held positions between weekly rebuilds.
# DE-RISK ONLY: may tighten stops, lower take-profits, trim, or exit — never
# loosen a stop, extend a target, or open an entry (enforced in risk_review.py).
[risk_review]
enabled              = true
alert_only           = true    # ships SAFE: journal + push, place/override NOTHING
                               #   (also forced alert-only whenever live_approved=false)
midday_et            = "12:00" # intraday check (may act now)
close_et             = "15:45" # pre-close tend (before 16:00 so orders place in RTH)
# Attention thresholds — starting points that surface a name for closer LLM look;
# they are NOT hard triggers (the agent judges every held name each pass).
ma_break_days        = 21      # revives the specced-but-dead ma_exit line
giveback_flag_pct    = 0.10    # flag when a name gives back >10% from its high since entry
vol_expansion_mult   = 1.75    # flag when daily sigma now > 1.75x the sigma at entry
earnings_window_days = 5       # flag earnings within this many days (overnight-gap risk)

# --- Universe maintenance (Piece 1) — quarterly liquidity refresh + weekly seed-watch ---
[universe_maintenance]
target_size            = 150          # universe size
keep_rank_max          = 180          # incumbent kept while $-vol rank <= this (band)
add_rank_max           = 150          # non-incumbent eligible to add while rank <= this
add_dvol_floor_usd     = 50_000_000   # hard min turnover for an ADD (junk gate)
screen_top_n           = 400          # market-cap screen depth for the pond
screen_min_mktcap      = 2_000_000_000
auto_apply_max_changes = 5            # > this many changes ⇒ HOLD for review
stale_seed_rank_floor  = 100          # seed in bottom third (of 150) counts toward stale
stale_seed_weeks       = 8            # consecutive weeks flagged ⇒ surface for decision
seed_watch_history     = 16           # weeks of rank history to retain per seed
