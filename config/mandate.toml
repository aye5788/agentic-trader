# THE MANDATE — the falsifiable terms the agent operates under.
#
# This file states WHAT SUCCESS IS. It states nothing about HOW to trade: no
# universe, no entry signal, no exit rule, no sizing formula. Those belong to the
# agent (docs/superpowers/specs/2026-08-09-agent-authority-inversion-design.md §3).
#
# If a line here reads as an instruction about WHAT to trade, that is a defect in
# this file. Report it rather than obeying it.
#
# Every criterion is three-state: PASS / FAIL / INSUFFICIENT_DATA.
# INSUFFICIENT_DATA is never a pass.

# --- IDENTITY (not an instruction about WHAT to trade) -----------------------
# WHERE execution is permitted at all — CLAUDE.md hard rule 1.
#
# Pinned here because refresh_broker_snapshot used to read the expected account
# back OUT of the snapshot it was about to overwrite: identity bootstrapped from
# its own output. One blank write disarmed the guard permanently and nothing
# could repair it, since every later write re-read the blank it had written
# (2026-08-17, and once before in e49c82b).
#
# The second failure was subtler and worse. The Robinhood MCP payload carries no
# account number in any field, so the ONLY way to satisfy the guard was for the
# agent to inject the number itself — the party under verification asserting the
# fact being verified. A guard satisfiable only by fabricating its input does not
# check identity; it teaches the agent to manufacture whatever a check wants.
#
# An operator-declared constant cannot be erased by the thing it guards, and
# cannot be supplied by the party being checked.
[account]
number = "948184924"     # the Agentic account — the ONLY tradeable one

# --- BLOCKING (safety). A FAIL here makes the machine act. -------------------
[drawdown]
max_pct = 0.20        # close-to-close, from the all-time high-water mark.
                      #   Breach -> mechanical flatten. NEVER measured intraday:
                      #   an intraday measure fires the flatten on noise.
                      #
                      # Was 0.15 in the approved spec. Changed 2026-08-10 after
                      # running it against the real book, which sits at -15.29%
                      # from a peak of 81.99 -- i.e. ALREADY BREACHED by 0.29
                      # percentage points. That is not a risk limit, it is a coin
                      # toss that happened to land on FAIL.
                      #
                      # The failure it would cause is a DEADLOCK, not a flatten.
                      # A breach sets flatten=True AND block_entries=True. On an
                      # already-flat book the flatten is a no-op, but the entry
                      # block is not -- and equity cannot climb back above the
                      # threshold while the book is forbidden to trade. The
                      # system would flatten once and then be frozen forever.
                      #
                      # 0.20 clears the current state with real room, is still
                      # tighter than the live [governance] max_drawdown of 0.25,
                      # and is far inside the 35-49% max drawdowns scripts/
                      # sim_recycle.py measured for a long-only momentum book
                      # over ten years.

[concentration]
max_position_pct = 0.15   # no single position above this share of equity, at any mark

# --- INFORMATIONAL (performance). These judge whether autonomy is working.
# --- They NEVER gate an order.  ----------------------------------------------
[pnl_concentration]
window_days        = 90
max_single_share   = 0.40   # no one closed round-trip above this share of realized P&L
min_distinct_names = 4      # ...and at least this many distinct names closed

[relative_return]
window_days = 60            # trading days
benchmark   = "SPY"

# NOTE: a tradeability/liquidity floor does NOT belong in this file (moved to
# config/strategy.toml [governance] 2026-08-10, FIX C). This file states WHAT
# SUCCESS IS -- a falsifiable criterion the agent is judged against. A
# liquidity floor is a GATE CONSTRAINT (safety, not a success criterion): it
# says what may be traded at all, never whether the agent is doing well. The
# design spec defines the mandate as exactly four criteria (§5) and places
# liquidity in the gate (§8.2); mandate.status() has never read [liquidity].
# See config/strategy.toml [governance] min_dollar_volume_20d.
